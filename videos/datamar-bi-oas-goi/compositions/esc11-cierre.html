<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #0d4988;
          font-family: "Montserrat", sans-serif;
          color: #ffffff;
        }
        .bg-mesh {
          position: absolute;
          inset: -60px;
          background-image: radial-gradient(rgba(255, 255, 255, 0.16) 2px, transparent 2px);
          background-size: 48px 48px;
        }
        .bg-glow {
          position: absolute;
          top: -300px;
          left: -240px;
          width: 1100px;
          height: 1100px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(41, 161, 230, 0.5) 0%, rgba(41, 161, 230, 0) 68%);
        }
        .bg-glow-2 {
          position: absolute;
          bottom: -380px;
          right: -260px;
          width: 900px;
          height: 900px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(0, 125, 201, 0.45) 0%, rgba(0, 125, 201, 0) 70%);
        }

        .stage {
          position: absolute;
          inset: 0;
          padding: 120px 150px 200px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: flex-start;
        }

        .eyebrow {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 28px;
          letter-spacing: 0.3em;
          color: #9fd4f5;
          text-transform: uppercase;
          margin-bottom: 40px;
        }

        .recap {
          display: flex;
          gap: 22px;
          margin-bottom: 62px;
        }
        .chip {
          border: 3px solid rgba(255, 255, 255, 0.55);
          padding: 22px 34px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 32px;
          letter-spacing: 0.06em;
          color: #ffffff;
        }

        .title {
          font-size: 86px;
          font-weight: 900;
          line-height: 1.08;
          letter-spacing: -0.03em;
          max-width: 1440px;
        }

        .rule {
          width: 300px;
          height: 6px;
          background: #29a1e6;
          margin: 44px 0 34px;
          transform-origin: left center;
        }

        .foot {
          display: flex;
          align-items: center;
          gap: 40px;
        }
        .foot-logo {
          display: block;
          width: 330px;
          height: 117px;
          flex: 0 0 auto;
        }
        .foot-rule {
          width: 3px;
          height: 96px;
          background: rgba(255, 255, 255, 0.4);
          flex: 0 0 auto;
        }
        .foot-name {
          font-family: "IBM Plex Mono", monospace;
          font-size: 25px;
          line-height: 1.45;
          letter-spacing: 0.12em;
          color: rgba(255, 255, 255, 0.9);
          text-transform: uppercase;
        }
      </style>

      <div
        id="root"
        data-composition-id="esc11-cierre"
        data-width="1920"
        data-height="1080"
        data-duration="15"
      >
        <div class="bg-mesh" id="s11-mesh"></div>
        <div class="bg-glow" id="s11-glow"></div>
        <div class="bg-glow-2" id="s11-glow2"></div>

        <div class="stage">
          <div class="eyebrow" id="s11-eyebrow">Ya lo sabes hacer</div>

          <div class="recap">
            <div class="chip" id="s11-c1">Acceder</div>
            <div class="chip" id="s11-c2">Navegar</div>
            <div class="chip" id="s11-c3">Filtrar</div>
            <div class="chip" id="s11-c4">Exportar</div>
          </div>

          <div class="title" id="s11-title">Ya puedes navegar Datamart BI</div>

          <div class="rule" id="s11-rule"></div>

          <div class="foot" id="s11-foot">
            <img
              class="foot-logo"
              src="assets/marca/bcrp-blanco.png"
              width="330"
              height="117"
              alt="Banco Central de Reserva del Perú"
            />
            <div class="foot-rule"></div>
            <div class="foot-name">
              <div>Gerencia de Operaciones</div>
              <div>Internacionales</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#s11-mesh", { y: 0 }, { y: 48, duration: 15, ease: "none" }, 0);
          tl.fromTo(
            "#s11-glow",
            { scale: 0.9, opacity: 0.6 },
            { scale: 1.08, opacity: 0.9, duration: 7.5, ease: "sine.inOut", yoyo: true, repeat: 1 },
            0
          );
          tl.fromTo(
            "#s11-glow2",
            { scale: 1.06, opacity: 0.75 },
            { scale: 0.92, opacity: 0.5, duration: 7.5, ease: "sine.inOut", yoyo: true, repeat: 1 },
            0
          );

          tl.fromTo("#s11-eyebrow", { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);

          /* waterfall-entry: las cuatro acciones llegan como cascada acelerada */
          const chips = ["#s11-c1", "#s11-c2", "#s11-c3", "#s11-c4"];
          chips.forEach((c, i) => {
            tl.fromTo(
              c,
              { autoAlpha: 0, y: 54, scale: 0.9 },
              { autoAlpha: 1, y: 0, scale: 1, duration: 0.52, ease: "back.out(1.7)" },
              0.62 + i * 0.13
            );
          });

          tl.fromTo("#s11-title", { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.68, ease: "power4.out" }, 1.32);
          tl.fromTo("#s11-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut" }, 1.7);
          tl.fromTo("#s11-foot", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.95);

          /* respiración final del bloque de acciones — conteo finito */
          tl.to(".recap", { y: -8, duration: 3.4, ease: "sine.inOut", yoyo: true, repeat: 2 }, 3.2);

          window.__timelines["esc11-cierre"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
