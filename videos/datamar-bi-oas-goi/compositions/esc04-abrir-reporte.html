<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #f4f7fb;
          font-family: "Montserrat", sans-serif;
          color: #0f2b4a;
        }
        .bg-mesh {
          position: absolute;
          inset: -60px;
          background-image: radial-gradient(rgba(13, 73, 136, 0.22) 2px, transparent 2px);
          background-size: 48px 48px;
          opacity: 0.55;
        }
        .bg-glow {
          position: absolute;
          top: -300px;
          right: -240px;
          width: 1000px;
          height: 1000px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(41, 161, 230, 0.26) 0%, rgba(41, 161, 230, 0) 68%);
        }
        .topbar {
          position: absolute;
          top: 0;
          left: 0;
          width: 1920px;
          height: 8px;
          background: #003366;
          transform-origin: left center;
        }
        .panel {
          position: absolute;
          left: 0;
          top: 8px;
          width: 620px;
          height: 922px;
          padding: 132px 58px 0 110px;
        }
        .step {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 26px;
          letter-spacing: 0.22em;
          color: #007dc9;
          text-transform: uppercase;
          margin-bottom: 26px;
        }
        .ptitle {
          font-size: 58px;
          font-weight: 900;
          line-height: 1.1;
          letter-spacing: -0.03em;
          color: #003366;
        }
        .prule {
          width: 120px;
          height: 5px;
          background: #29a1e6;
          margin: 32px 0 28px;
          transform-origin: left center;
        }
        .psub {
          font-size: 32px;
          font-weight: 400;
          line-height: 1.42;
        }
        .cue {
          font-family: "IBM Plex Mono", monospace;
          font-size: 25px;
          font-weight: 700;
          color: #0d4988;
          padding-left: 26px;
          border-left: 4px solid #29a1e6;
          line-height: 1.3;
          margin-top: 42px;
        }
        .divider {
          position: absolute;
          left: 620px;
          top: 8px;
          width: 2px;
          height: 922px;
          background: #c9d8e8;
          transform-origin: top center;
        }
        .stage {
          position: absolute;
          left: 620px;
          top: 8px;
          width: 1300px;
          height: 922px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .card {
          position: relative;
          overflow: hidden;
          background: #ffffff;
          border: 3px solid #c9d8e8;
          box-shadow: 0 20px 54px rgba(0, 51, 102, 0.2);
        }
        .zoom {
          position: absolute;
          left: 0;
          top: 0;
          transform-origin: 0 0;
        }
        .zoom img {
          display: block;
        }
        .spot {
          position: absolute;
          left: 0;
          top: 0;
          transform-origin: 0 0;
          box-shadow: 0 0 0 9999px rgba(13, 73, 136, 0.4);
        }

        /* --- componente simulated-cursor (registro hyperframes) --- */
        .hf-simulated-cursor {
          position: absolute;
          left: 0;
          top: 0;
          width: calc(44px * var(--hf-cursor-scale, 1));
          height: calc(44px * var(--hf-cursor-scale, 1));
          transform: translate3d(var(--hf-cursor-x, 0px), var(--hf-cursor-y, 0px), 0);
          pointer-events: none;
          z-index: 999;
          filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.24));
        }
        .hf-simulated-cursor svg {
          width: 100%;
          height: 100%;
        }
        .hf-simulated-cursor svg path {
          fill: var(--hf-cursor-fill, #ffffff);
          stroke: var(--hf-cursor-edge, rgba(0, 0, 0, 0.45));
        }
        .hf-simulated-cursor-pulse {
          display: var(--hf-cursor-ring-display, block);
          position: absolute;
          left: calc((20px - var(--hf-cursor-ring-size, 22px) / 2) * var(--hf-cursor-scale, 1));
          top: calc((20px - var(--hf-cursor-ring-size, 22px) / 2) * var(--hf-cursor-scale, 1));
          width: calc(var(--hf-cursor-ring-size, 22px) * var(--hf-cursor-scale, 1));
          height: calc(var(--hf-cursor-ring-size, 22px) * var(--hf-cursor-scale, 1));
          border: calc(var(--hf-cursor-ring-width, 2px) * var(--hf-cursor-scale, 1)) solid
            var(--hf-cursor-ring, rgba(255, 255, 255, 0.85));
          border-radius: 999px;
          opacity: 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="esc04-abrir-reporte"
        data-width="1920"
        data-height="1080"
        data-duration="12"
      >
        <div class="bg-mesh" id="s4-mesh"></div>
        <div class="bg-glow" id="s4-glow"></div>
        <div class="topbar" id="s4-topbar"></div>

        <div class="panel">
          <div class="step" id="s4-step">Paso 04</div>
          <div class="ptitle" id="s4-title">Da clic para abrir un reporte</div>
          <div class="prule" id="s4-rule"></div>
          <div class="psub" id="s4-sub">Basta un clic sobre el nombre del reporte que necesitas.</div>
          <div class="cue" id="s4-cue">Portafolio vs Referencia</div>
        </div>

        <div class="divider" id="s4-divider"></div>

        <div class="stage">
          <div class="card" id="s4-card" style="width: 1118px; height: 499px">
            <div class="zoom" id="s4-zoom" style="width: 1300px; height: 580px">
              <img
                src="assets/capturas/escena04_reporte_portafolio_vs_referencia.png"
                width="1300"
                height="580"
                alt=""
              />
              <div class="spot" id="s4-spot" style="width: 198px; height: 45px"></div>
            </div>

            <div class="hf-simulated-cursor" id="s4-cursor" aria-hidden="true">
              <div class="hf-simulated-cursor-pulse" id="s4-pulse"></div>
              <svg id="s4-cursor-svg" viewBox="0 0 24 24" width="44" height="44">
                <path
                  d="M3 2.8 20.6 14 12.8 15.5 9 22 3 2.8Z"
                  fill="white"
                  stroke="rgba(0,0,0,0.45)"
                  stroke-width="1.4"
                />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          /* el cursor va sobre pantalla blanca: tono oscuro, anillo azul */
          const cur = document.getElementById("s4-cursor");
          cur.style.setProperty("--hf-cursor-scale", "1.35");
          cur.style.setProperty("--hf-cursor-fill", "#18181b");
          cur.style.setProperty("--hf-cursor-edge", "rgba(255,255,255,0.85)");
          cur.style.setProperty("--hf-cursor-ring", "#007dc9");
          cur.style.setProperty("--hf-cursor-ring-size", "26px");
          cur.style.setProperty("--hf-cursor-ring-width", "3px");

          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#s4-mesh", { y: 0 }, { y: 40, duration: 12, ease: "none" }, 0);
          tl.fromTo(
            "#s4-glow",
            { scale: 0.94, opacity: 0.78 },
            { scale: 1.06, opacity: 1, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 },
            0
          );
          tl.fromTo("#s4-topbar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo("#s4-divider", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.out" }, 0.2);

          tl.fromTo("#s4-step", { autoAlpha: 0, x: -34 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power2.out" }, 0.15);
          tl.fromTo("#s4-title", { autoAlpha: 0, y: 44 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power4.out" }, 0.3);
          tl.fromTo("#s4-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 0.62);
          tl.fromTo("#s4-sub", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.75);

          tl.fromTo(
            "#s4-card",
            { autoAlpha: 0, scale: 0.955, y: 26 },
            { autoAlpha: 1, scale: 1, y: 0, duration: 0.72, ease: "back.out(1.4)" },
            0.5
          );

          /* la cámara se mantiene: el encuadre completo es el mapa donde ocurre el clic */
          tl.set("#s4-zoom", { scale: 0.86, x: 0, y: 0 }, 0);

          /* --- cursor-click-ripple --- */
          /* entra desde fuera del encuadre, viaja al enlace marcado y se hunde */
          tl.set("#s4-cursor", { "--hf-cursor-x": "1160px", "--hf-cursor-y": "540px" }, 0);
          tl.fromTo("#s4-cursor", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 1.9);
          tl.to(
            "#s4-cursor",
            { "--hf-cursor-x": "112px", "--hf-cursor-y": "212px", duration: 1.65, ease: "power2.inOut" },
            2.1
          );

          /* physics-press-reaction: compresión y recuperación */
          /* la compresión va en el SVG interno: el elemento externo conserva
             su transform de posición, que se anima por variables CSS */
          tl.to("#s4-cursor-svg", { scale: 0.86, duration: 0.1, ease: "power2.in" }, 4.05);
          tl.to("#s4-cursor-svg", { scale: 1, duration: 0.24, ease: "back.out(3)" }, 4.15);
          tl.fromTo(
            "#s4-pulse",
            { opacity: 0.85, scale: 0.2 },
            { opacity: 0, scale: 2.6, duration: 0.55, ease: "power2.out" },
            4.08
          );

          /* el reflector se enciende justo en el impacto */
          tl.set("#s4-spot", { x: 0, y: 205 }, 0);
          tl.fromTo("#s4-spot", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.45, ease: "power2.out" }, 4.1);
          tl.fromTo("#s4-cue", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power2.out" }, 4.2);

          /* el cursor se retira para dejar leer el resultado */
          tl.to("#s4-cursor", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 6.4);
          tl.to("#s4-spot", { autoAlpha: 0, duration: 0.45, ease: "power2.in" }, 11.3);

          window.__timelines["esc04-abrir-reporte"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
